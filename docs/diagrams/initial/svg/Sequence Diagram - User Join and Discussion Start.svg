ont-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="179" x="5" y="335.8555">alt All participants ready</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="339" x="25" y="352.3438">RoomMgr --&gt; SocketHandler : All ready = true</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="127" x="5" y="368.832">else Not all ready</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="345" x="25" y="385.3203">RoomMgr --&gt; SocketHandler : All ready = false</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="26" x="5" y="401.8086">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="148" x="5" y="418.2969">deactivate RoomMgr</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="5" x="5" y="434.7852">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="477" x="5" y="451.2734">SocketHandler -&gt; Server : emit('participants-update', participants)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="342" x="5" y="467.7617">Server --&gt; Browser : participants-update event</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="342" x="5" y="484.25">Browser -&gt; Browser : Update ready status in UI</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="122" x="5" y="500.7383">deactivate Server</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-wei